<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="birthday-container0">
    <div class="message"> Happy Birthday </div>    
  </div>
  <div class="birthday-container1">
    <div class="message"> Enjoy your day </div>    
    
  </div>
  <div class="birthday-container2">
    <div class="message"> Enjoy your day with style </div>    
    
  </div>
  <div class="birthday-container3">    
    <div class="message"> May your next 365 days be legendary </div>    
    
  </div>
  <div class="birthday-container4">    
    <div class="message"> Cheers to you </div>
</div>
<div>
    <button type="button" class="start-btn" id="start-btn">Start</button>
</div>
<div id="juego" class="birthday-container0" hidden>
    <div id="frase" class="message"></div>
    <p>Press V (True) or F (False) in less than 1.5 seconds.</p>
    <button type="button" id="btn-v" class="start-btn">V</button>
    <button type="button" id="btn-f" class="start-btn">F</button>
    <p id="resultado"></p>
    <p id="puntaje"></p>
</div>
<script src="lies.js"></script>
</body>
</html>
